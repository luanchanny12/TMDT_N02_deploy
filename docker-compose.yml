services:
  app:
    build:
      context: ./docker/php
    image: socialshop-php:8.2
    container_name: socialshop-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_volume:/var/www/vendor
    environment:
      APP_ENV: local
      # Mặc định tắt debug để trang lỗi không lộ secrets; bật bằng DOCKER_APP_DEBUG=true khi cần dev
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8081}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: social_commerce
      DB_USERNAME: social
      DB_PASSWORD: social_secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      # VNPAY_TMN_CODE / VNPAY_HASH_SECRET đọc từ file .env (không hardcode secret trong git)
      VNPAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      VNPAY_RETURN_URL: ${APP_URL:-http://localhost:8081}/payment/vnpay/return
      GOOGLE_REDIRECT_URI: ${APP_URL:-http://localhost:8081}/auth/google/callback
      FACEBOOK_REDIRECT_URI: ${APP_URL:-http://localhost:8081}/auth/facebook/callback
      # Chatbot gọi microservice ai-service qua mạng nội bộ Docker
      AI_SERVICE_URL: http://ai-service:3000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-ai-token}
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: socialshop-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: socialshop-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: social_commerce
      MYSQL_USER: social
      MYSQL_PASSWORD: social_secret
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: socialshop-phpmyadmin
    restart: unless-stopped
    ports:
      - "8888:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: social
      PMA_PASSWORD: social_secret
    depends_on:
      mysql:
        condition: service_healthy

  vite:
    image: node:22-alpine
    container_name: socialshop-vite
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "npm install && npx vite build --watch"
    ports:
      - "5173:5173"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8081}
    volumes:
      - .:/var/www
      - vite_node_modules:/var/www/node_modules

  mailpit:
    image: axllent/mailpit:latest
    container_name: socialshop-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  queue-worker:
    build:
      context: ./docker/php
    image: socialshop-php:8.2
    container_name: socialshop-queue-worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www
      - vendor_volume:/var/www/vendor
    environment:
      APP_ENV: local
      # Mặc định tắt debug để trang lỗi không lộ secrets; bật bằng DOCKER_APP_DEBUG=true khi cần dev
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8081}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: social_commerce
      DB_USERNAME: social
      DB_PASSWORD: social_secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  scheduler:
    build:
      context: ./docker/php
    image: socialshop-php:8.2
    container_name: socialshop-scheduler
    restart: unless-stopped
    working_dir: /var/www
    # Chạy Laravel scheduler: hủy đơn VNPay quá hạn, backup DB hằng ngày
    command: php artisan schedule:work
    volumes:
      - .:/var/www
      - vendor_volume:/var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8081}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: social_commerce
      DB_USERNAME: social
      DB_PASSWORD: social_secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  # Microservice chatbot AI (Node.js) — giữ khóa Gemini, không mở cổng ra ngoài
  ai-service:
    build:
      context: ./services/ai-service
    image: socialshop-ai-service:1.0
    container_name: socialshop-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-ai-token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      RATE_LIMIT_PER_MINUTE: "120"

volumes:
  vendor_volume:
  vite_node_modules:
  mysql_data:
