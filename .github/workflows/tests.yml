name: Tests

on:
  push:
    branches:
      - main
      - be_quan
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Copy environment file
        run: cp .env.testing.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations (SQLite in-memory)
        run: php artisan migrate --force

      - name: Execute tests
        run: php artisan test

  ai-service:
    runs-on: ubuntu-latest

    name: ai-service (Node 22)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run microservice tests
        working-directory: services/ai-service
        run: npm test
